<!DOCTYPE html>
<html>
    <head>
        <script>

            let usrInput = parseFloat(prompt("Enter the amount you spent."));

            if (usrInput >= 100) {
                console.log("Final cost is £", usrInput * 0.9);
            } else {
                console.log("Final cost is £", usrInput);
            }

        </script>
    </head>
</html>
