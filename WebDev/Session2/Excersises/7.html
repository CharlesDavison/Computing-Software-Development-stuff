<!DOCTYPE html>
<html>
    <head>
        <script>

         let usrInput = parseInt(prompt("Enter the temperature."));

         if (usrInput <= 0) {
             console.log("Freezing");
         } else if (usrInput < 15) {
             console.log("Cold");
         } else if (usrInput < 25) {
             console.log("Warm");
         } else if (usrInput < 40) {
             console.log("Hot.");
         } else {
             console.log("ouch");
         }
        </script>
    </head>
</html>
