<!DOCTYPE html>
<html>
    <head>
        <script>

            let usrInput = parseInt(prompt("Enter a number between 1 and 10"));

            if ((usrInput % 2) == 0) {
                console.log("The number is even");
            } else {
                console.log("The number is odd");
            }

        </script>
    </head>
</html>
