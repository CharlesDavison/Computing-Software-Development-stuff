<!DOCTYPE html>
<html>
    <head>
        <script>

            let usrInput = parseInt(prompt("Enter any number."));

            if (usrInput > 0) {
                console.log("The number is positive.");
            } else if (usrInput < 0) {
                console.log("The number is negative.");
            } else {
                console.log("The number is zero.");
            }

        </script>
    </head>
</html>
