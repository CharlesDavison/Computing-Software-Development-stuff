<!DOCTYPE html>
<html>
    <head>
        <script>

            let usrInput = parseInt(prompt("Enter your grade."));

            if (usrInput >= 70) {
                console.log("You have achieved an A.");
            } else if (usrInput >= 60) {
                console.log("You have achieved a B.");
            } else if (usrInput >= 50) {
                console.log("You have achieved a C.");
            } else if (usrInput >= 40) {
                console.log("You have achieved a D.");
            } else {
                console.log("You have failed.");
            }

        </script>
    </head>
</html>
