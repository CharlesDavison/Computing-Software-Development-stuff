<!DOCTYPE html>
<html>
    <head>
        <script>

            let num1 = parseInt(prompt("Enter a number."));
            let num2 = parseInt(prompt("Enter another number."));

            if (num1 > num2) {
                console.log(num1);
            } else if (num1 < num2) {
                console.log(num2);
            } else {
                console.log("Both numbers are equal.");
            }

        </script>
    </head>
</html>
