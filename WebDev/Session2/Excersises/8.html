<!DOCTYPE html>
<html>
    <head>
        <script>

            let team1 = parseInt(prompt("Enter the score for Team 1:"));
            let team2 = parseInt(prompt("Enter the score for Team 2:"));

            if (team1 > team2) {
                console.log("Team 1 Win - 3 points")
                console.log("Team 2 Loss - 0 points")
            } else if (team1 < team2) {
                console.log("Team 2 Win - 3 points")
                console.log("Team 1 Loss - 0 points")
            } else {
                console.log("Draw - 1 point each")
            }

        </script>
    </head>
</html>
