<!DOCTYPE html>
<html>
    <head>
        <script>

            let weight = parseInt(prompt("Enter your weight in kg."));
            let height = parseFloat(prompt("Enter your height in m."));

            let BMI = weight / Math.pow(height, 2);

            if (BMI < 18.5) {
                console.log("Your BMI is", BMI, "which means you are underweight.");
            } else if (BMI >= 18.5 && BMI <= 24.9) {
                console.log("Your BMI is", BMI, "which means you are a healthy weight.");
            } else if (BMI >= 25 && BMI <= 29.9) {
                console.log("Your BMI is", BMI, "which means you are overweight.");
            } else {
                console.log("Your BMI is", BMI, "which means you are obese.");
            }

        </script>
    </head>
</html>
