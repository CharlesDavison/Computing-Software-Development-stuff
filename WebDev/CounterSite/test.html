<!DOCTYPE html>
<html>

    <head>
        <title>Hello Javascript</title>

        <script src="test.js" defer></script>
    </head>

    <body>
        <h2>Counter:</h2>

        <p id="counter" style="font-size:30px">0</p>

        <button type="button" onclick="increaseCounter()">+</button>
