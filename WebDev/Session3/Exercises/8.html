<!DOCTYPE html>
<html>
    <head>
        <script>

        let largestNumber = 0;

        do {
            usrInput = parseInt(prompt("Enter a number."));

            if (usrInput > largestNumber) {
                largestNumber = usrInput;
            }

        } while (usrInput != 0);

        console.log("The largest number entered was: " + largestNumber);

        </script>
    </head>
</html>
