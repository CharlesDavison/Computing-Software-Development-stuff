<!DOCTYPE html>
<html>
    <head>
        <script>

        let total = 0;
        let average = 0;

        for(let i = 0; i < 3; i++) {
            total = total + parseInt(prompt("Enter a number."));
        }
        average = total / 3;

        console.log("The average of the three numbers is: " + average);

        </script>
    </head>
</html>
